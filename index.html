<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胡志明市臺灣學校學生會 - 參與表達平台</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f1f5f9;
            --header-bg: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
        }

        /* 頂部藍色 Banner 區塊 (參考意見箱風格) */
        .hero-header {
            background: var(--header-bg);
            color: #ffffff;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }

        .hero-title {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .hero-subtitle {
            font-size: 0.95rem;
            color: #dbeafe;
            margin-bottom: 0;
            font-weight: 500;
        }

        /* 導覽列 (右上角專屬頁面按鈕區) */
        .ref-navbar {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .ref-nav-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ref-nav-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 800;
            font-size: 1.05rem;
        }

        .ref-logo-img {
            height: 32px;
            width: auto;
            margin-right: 10px;
        }

        .ref-nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .ref-nav-item {
            text-decoration: none;
            color: var(--text-muted);
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .ref-nav-item:hover, .ref-nav-item.active {
            color: var(--text-dark);
            background-color: #f1f5f9;
        }

        .ref-admin-btn {
            background-color: #fef9c3;
            color: #854d0e;
        }

        .ref-admin-btn:hover {
            background-color: #fef08a;
            color: #713f12;
        }

        /* 內容容器 */
        .main-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px 60px 20px;
        }

        /* 規則提醒卡片 */
        .notice-card {
            background: #e0f2fe;
            border: 1px solid #bae6fd;
            border-radius: 12px;
            padding: 16px 20px;
            color: #0369a1;
            font-size: 0.95rem;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* 卡片面板 */
        .content-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 28px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            margin-bottom: 24px;
        }

        .proposal-item {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.2s ease;
            background: #ffffff;
        }

        .proposal-item:hover {
            border-color: #2563eb;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
        }

        .btn-vote-go {
            background-color: #2563eb;
            color: #ffffff;
            border-radius: 6px;
            padding: 6px 16px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s ease;
        }

        .btn-vote-go:hover {
            background-color: #1d4ed8;
            color: #ffffff;
        }

        @media (max-width: 576px) {
            .ref-nav-container {
                flex-direction: column;
                gap: 10px;
            }
            .hero-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- 頂部藍色簡潔 Header -->
    <header class="hero-header">
        <div class="hero-title">
            <span>🏛️ 胡志明市臺灣學校學生會</span>
        </div>
        <p class="hero-subtitle">TPSHCMCSC Student Council - 學生公投與意見徵集平台</p>
    </header>

    <!-- 導覽列：右上角專屬頁面按鈕 -->
    <nav class="ref-navbar">
        <div class="ref-nav-container">
            <a href="index.html" class="ref-nav-brand">
                <img src="tpshcmcsc.png" alt="會徽" class="ref-logo-img">
                <span>TPSHCMCSC 專區</span>
            </a>
            <div class="ref-nav-links">
                <a href="index.html" class="ref-nav-item active">🏠 首頁與通知</a>
                <a href="results.html" class="ref-nav-item">📊 開票與歷史結果</a>
                <a href="admin.html" class="ref-nav-item ref-admin-btn">⚙️ 管理員後台</a>
            </div>
        </div>
    </nav>

    <!-- 主體內容區塊 -->
    <main class="main-container">
        <!-- 規則與提示 -->
        <div class="notice-card">
            <span style="font-size: 1.3rem;">🔒</span>
            <div>
                <strong>提醒：</strong>本平台採用實名驗證，投票或提交意見時請使用學校官方信箱 (<code>@tshcmc.edu.vn</code>)。提交成功後系統將寄發憑證確認信。
            </div>
        </div>

        <!-- 開放中的投票與意見項目列表 -->
        <div class="content-card">
            <h4 class="fw-bold mb-3 text-dark">📢 目前開放中的項目</h4>
            <div id="proposalsContainer">
                <div class="text-center text-muted py-4">
                    <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
                    <div>正在載入最新提案與意見徵集項目...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const GAS_API = "https://script.google.com/macros/s/AKfycbz3YUvaNzi4Ed3JfUSgdHtVQinjB30wMISJamSwK7OSn9wWFIyO_60na0myOdXBTLVe/exec";

        async function loadProposals() {
            const container = document.getElementById("proposalsContainer");
            try {
                const res = await fetch(`${GAS_API}?action=getProposals`);
                const proposals = await res.json();

                // 篩選出開放中的項目
                const activeProposals = proposals.filter(p => p.status === "active" || p.status === "開放中" || !p.status);

                if (!activeProposals || activeProposals.length === 0) {
                    container.innerHTML = `
                        <div class="text-center text-muted py-4">
                            目前暫無開放中的公投或意見徵集項目。
                        </div>
                    `;
                    return;
                }

                container.innerHTML = activeProposals.map(p => `
                    <div class="proposal-item d-flex justify-content-between align-items-center flex-wrap gap-3">
                        <div>
                            <div class="d-flex align-items-center gap-2 mb-1">
                                <span class="badge ${p.type === 'feedback' ? 'bg-info text-dark' : 'bg-primary'}">
                                    ${p.type === 'feedback' ? '💬 意見徵集' : '🗳️ 投票議題'}
                                </span>
                                <h5 class="mb-0 fw-bold text-dark">${escapeHtml(p.title)}</h5>
                            </div>
                            <p class="text-secondary small mb-0 mt-2">${escapeHtml(p.description || '點擊右側按鈕參與表達意見')}</p>
                        </div>
                        <div>
                            <a href="vote.html?id=${p.id}" class="btn-vote-go">前往表達意向 →</a>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                container.innerHTML = `
                    <div class="text-center text-danger py-4">
                        ⚠️ 載入資料失敗，請重新整理頁面或確認網路連線。
                    </div>
                `;
            }
        }

        function escapeHtml(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        loadProposals();
    </script>
</body>
</html>
