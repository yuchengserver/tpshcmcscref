<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胡志明市臺灣學校學生會 - 學生會公投與意見徵集平台</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f0f7ff; /* 下方背景改為極淡藍色 */
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --btn-primary: #0f172a;
            --btn-primary-hover: #1e293b;
        }

        body {
            background-color: var(--bg-main);
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 頂部導覽列 */
        .ref-navbar {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .ref-nav-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ref-nav-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 800;
            font-size: 1.1rem;
        }

        .ref-nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .ref-nav-item {
            text-decoration: none;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .ref-nav-item:hover, .ref-nav-item.active {
            color: var(--text-dark);
            background-color: #f1f5f9;
        }

        .ref-admin-btn {
            background-color: #fef9c3;
            color: #854d0e;
        }

        .ref-admin-btn:hover {
            background-color: #fef08a;
            color: #713f12;
        }

        /* Hero 區塊 */
        .hero-section {
            background-color: #f0f7ff;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            padding: 36px 20px 28px 20px;
        }

        .hero-logo-img {
            height: 70px;
            width: auto;
            object-fit: contain;
            margin-bottom: 12px;
            filter: brightness(0); /* 強制將校徽圖示調成黑色 */
        }

        .hero-title {
            font-size: 1.9rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .hero-subtitle {
            font-size: 0.92rem;
            color: var(--text-muted);
            margin-bottom: 0;
            font-weight: 500;
        }

        /* 主要內容區域 */
        .ref-container {
            max-width: 860px;
            margin: 0 auto;
            padding: 30px 20px 40px 20px;
            flex: 1;
        }

        .notice-banner {
            background-color: #ffffff;
            border: 1px solid #bae6fd;
            border-radius: 12px;
            padding: 14px 18px;
            color: #0369a1;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .ref-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .ref-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.06);
        }

        /* 針對尚未開始項目的卡片微調視覺（可選用較灰階或柔和樣式） */
        .ref-card-upcoming {
            background: #f8fafc;
            border: 1px dashed var(--border-color);
            opacity: 0.9;
        }

        .ref-badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 0.78rem;
            font-weight: 700;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .badge-poll { background: #e0f2fe; color: #0369a1; }
        .badge-feedback { background: #dcfce7; color: #15803d; }
        .badge-upcoming { background: #fef3c7; color: #92400e; } /* 黃色系代表預告/即將開始 */

        .ref-card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .ref-card-desc {
            color: var(--text-muted);
            font-size: 0.92rem;
            margin-bottom: 20px;
        }

        /* 著作權 Footer */
        .ref-footer {
            text-align: center;
            padding: 20px 0;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            background-color: #ffffff;
            margin-top: auto;
        }

        @media (max-width: 576px) {
            .ref-nav-container {
                flex-direction: column;
                gap: 10px;
            }
            .hero-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- 頂部 Header 導覽列 -->
    <nav class="ref-navbar">
        <div class="ref-nav-container">
            <a href="index.html" class="ref-nav-brand">
                <span>TSSC13TH 公投專區</span>
            </a>
            <div class="ref-nav-links">
                <a href="index.html" class="ref-nav-item active">🏫 首頁與通知</a>
                <a href="results.html" class="ref-nav-item">📊 開票與歷史結果</a>
                <a href="admin.html" class="ref-nav-item ref-admin-btn">⚙️ 管理員後台</a>
            </div>
        </div>
    </nav>

    <!-- 淡藍色背景 Hero 區塊 -->
    <header class="hero-section">
        <div>
            <img src="tpshcmcsc.png" alt="胡志明市臺灣學校學生會校徽" class="hero-logo-img">
        </div>
        <h1 class="hero-title">胡志明市臺灣學校學生會</h1>
        <p class="hero-subtitle">TPSHCMCSC Student Council - 學生公投與意見徵集平台</p>
    </header>

    <!-- 主要內容區域 -->
    <main class="ref-container">
        
        <!-- 提示訊息 -->
        <div class="notice-banner">
            <span style="font-size: 1.2rem;">🔒</span>
            <div>
                <strong>提醒：</strong>本平台採用實名驗證，投票或提交意見時請使用學校官方信箱 (<code>@tshcmc.edu.vn</code>)。提交成功後系統將寄發憑證確認信。
            </div>
        </div>

        <!-- 1. 目前開放中的項目 -->
        <div class="mb-4">
            <h2 class="h5 fw-bold text-dark mb-3">📢 目前開放中的項目</h2>
            <div id="activePollsList">
                <div class="text-center py-4 bg-white border rounded-3" style="border-color: var(--border-color) !important;">
                    <div class="spinner-border text-dark spinner-border-sm" role="status"></div>
                    <span class="ms-2 text-muted small">資料載入中...</span>
                </div>
            </div>
        </div>

        <!-- 2. 尚未開始 / 未開通的項目區塊 (新增) -->
        <div class="mt-5">
            <h2 class="h5 fw-bold text-dark mb-3">⏳ 即將開始 / 預告中的項目</h2>
            <div id="upcomingPollsList">
                <div class="text-center py-4 bg-white border rounded-3" style="border-color: var(--border-color) !important;">
                    <div class="spinner-border text-dark spinner-border-sm" role="status"></div>
                    <span class="ms-2 text-muted small">資料載入中...</span>
                </div>
            </div>
        </div>

    </main>

    <!-- 底部著作權標籤 -->
    <footer class="ref-footer">
        胡志明市台灣學校學生會 TSSC13TH © 2026 yucheng
    </footer>

    <script>
        const GAS_API = "https://script.google.com/macros/s/AKfycbz3YUvaNzi4Ed3JfUSgdHtVQinjB30wMISJamSwK7OSn9wWFIyO_60na0myOdXBTLVe/exec";

        async function loadAllPolls() {
            const activeContainer = document.getElementById("activePollsList");
            const upcomingContainer = document.getElementById("upcomingPollsList");

            try {
                const res = await fetch(`${GAS_API}?action=getProposals`);
                const allProposals = await res.json();

                if (!Array.isArray(allProposals)) {
                    throw new Error("資料格式錯誤");
                }

                // 分類：active (開放中) vs upcoming (未開始/即將開始)
                // 註：若還有 closed 的項目，您可以視需求要不要另外顯示，這裡先針對 status === "upcoming"
                const activePolls = allProposals.filter(p => String(p.status).toLowerCase() === "active");
                const upcomingPolls = allProposals.filter(p => String(p.status).toLowerCase() === "upcoming");

                // 1. 渲染「開放中」清單
                if (activePolls.length === 0) {
                    activeContainer.innerHTML = `
                        <div class="bg-white border rounded-3 p-4 text-center text-muted small" style="border-style: dashed !important;">
                            目前暫無開放中的公投或意見徵集項目。
                        </div>`;
                } else {
                    activeContainer.innerHTML = activePolls.map(p => {
                        const isFeedback = p.type === "feedback";
                        return `
                            <div class="ref-card">
                                <div>
                                    <span class="ref-badge ${isFeedback ? 'badge-feedback' : 'badge-poll'}">
                                        ${isFeedback ? '💡 意見徵集' : '🗳️ 選項投票'}
                                    </span>
                                    <h3 class="ref-card-title">${escapeHtml(p.title)}</h3>
                                    <p class="ref-card-desc">${escapeHtml(p.description || '無詳細說明')}</p>
                                </div>
                                <div class="text-end">
                                    <a href="vote.html?id=${p.id}" class="btn btn-dark fw-bold px-4" style="border-radius: 8px;">
                                        ${isFeedback ? '前往填寫建言 ➔' : '前往投票 ➔'}
                                    </a>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                // 2. 渲染「即將開始」清單
                if (upcomingPolls.length === 0) {
                    upcomingContainer.innerHTML = `
                        <div class="bg-white border rounded-3 p-4 text-center text-muted small" style="border-style: dashed !important;">
                            目前沒有即將開始的預告項目。
                        </div>`;
                } else {
                    upcomingContainer.innerHTML = upcomingPolls.map(p => {
                        const isFeedback = p.type === "feedback";
                        return `
                            <div class="ref-card ref-card-upcoming">
                                <div>
                                    <span class="ref-badge badge-upcoming">
                                        ⏳ 尚未開始 / 敬請期待
                                    </span>
                                    <h3 class="ref-card-title text-secondary">${escapeHtml(p.title)}</h3>
                                    <p class="ref-card-desc">${escapeHtml(p.description || '無詳細說明')}</p>
                                    ${p.startTime ? `<div class="small text-muted mb-3">🕒 開放時間：${escapeHtml(p.startTime)} 起</div>` : ''}
                                </div>
                                <div class="text-end">
                                    <button class="btn btn-outline-secondary fw-bold px-4" disabled style="border-radius: 8px;">
                                        尚未開放投票
                                    </button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

            } catch (err) {
                activeContainer.innerHTML = `<div class="alert alert-danger text-center py-3 small">資料載入失敗，請稍後再試。</div>`;
                upcomingContainer.innerHTML = `<div class="alert alert-danger text-center py-3 small">資料載入失敗，請稍後再試。</div>`;
            }
        }

        function escapeHtml(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        loadAllPolls();
    </script>
</body>
</html>
