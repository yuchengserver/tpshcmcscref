<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胡志明市臺灣學校學生會 - 投票與意見專區</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f0f7ff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --btn-primary: #0f172a;
            --btn-primary-hover: #1e293b;
            --accent-blue: #2563eb;
            --accent-blue-light: #eff6ff;
        }

        body {
            background-color: var(--bg-main);
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 頂部導覽列 */
        .ref-navbar {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .ref-nav-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ref-nav-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 800;
            font-size: 1.1rem;
        }

        .ref-nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .ref-nav-item {
            text-decoration: none;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .ref-nav-item:hover, .ref-nav-item.active {
            color: var(--text-dark);
            background-color: #f1f5f9;
        }

        .ref-admin-btn {
            background-color: #fef9c3;
            color: #854d0e;
        }

        .ref-admin-btn:hover {
            background-color: #fef08a;
            color: #713f12;
        }

        /* 內容主要容器 */
        .ref-container {
            max-width: 680px;
            margin: 40px auto;
            padding: 0 20px 60px 20px;
            flex: 1;
        }

        /* 卡片面板 */
        .ref-vote-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
        }

        /* 時間資訊標籤 */
        .time-badge-box {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.88rem;
            color: #475569;
            margin-bottom: 20px;
        }

        /* 時區提醒橫幅 */
        .notice-banner {
            background-color: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 12px 16px;
            color: #0369a1;
            font-size: 0.88rem;
            margin-bottom: 24px;
        }

        /* 單選選項卡片 */
        .option-label {
            display: flex;
            align-items: center;
            border: 1.5px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-dark);
            transition: all 0.2s ease;
            background-color: #ffffff;
        }

        .option-label:hover {
            border-color: var(--accent-blue);
            background-color: #f8fafc;
        }

        .option-label input[type="radio"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            accent-color: var(--accent-blue);
        }

        .option-label:has(input[type="radio"]:checked) {
            border-color: var(--accent-blue);
            background-color: var(--accent-blue-light);
            color: #1e40af;
        }

        .form-control {
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: var(--btn-primary);
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1);
        }

        .btn-submit {
            background-color: var(--btn-primary);
            color: #ffffff;
            border-radius: 8px;
            padding: 14px;
            font-weight: 700;
            font-size: 1.05rem;
            border: none;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: var(--btn-primary-hover);
            color: #ffffff;
        }

        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        /* Footer */
        .ref-footer {
            text-align: center;
            padding: 20px 0;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            background-color: #ffffff;
            margin-top: auto;
        }

        @media (max-width: 576px) {
            .ref-nav-container {
                flex-direction: column;
                gap: 10px;
            }
            .ref-vote-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- 頂部滿版導覽列 -->
    <nav class="ref-navbar">
        <div class="ref-nav-container">
            <a href="index.html" class="ref-nav-brand">
                <span>TSSC13TH 公投專區</span>
            </a>
            <div class="ref-nav-links">
                <a href="index.html" class="ref-nav-item">首頁</a>
                <a href="results.html" class="ref-nav-item">開票與歷史結果</a>
                <a href="admin.html" class="ref-nav-item ref-admin-btn">⚙️ 管理員後台</a>
            </div>
        </div>
    </nav>

    <!-- 主要內容卡片區塊 -->
    <main class="ref-container">
        <div class="ref-vote-card">
            <div class="d-flex justify-content-between align-items-start mb-2">
                <h2 id="pTitle" class="fw-bold text-dark fs-3 m-0">載入提案中...</h2>
                <span id="statusBadge" class="badge bg-secondary">載入中</span>
            </div>

            <p id="pDesc" class="text-secondary mb-3 fs-6">請稍候，正在取得提案內容...</p>
            
            <!-- 時區與時間資訊區塊 -->
            <div class="notice-banner mb-3">
                🕒 <strong>時區提醒：</strong>本平台所有公投時間均依<strong>越南時間 (GMT+7)</strong> 計算。
            </div>

            <div id="timeInfoArea" class="time-badge-box d-none mb-4">
                <div>📅 開始時間：<span id="startTimeText" class="fw-semibold text-dark">-</span></div>
                <div>⏳ 截止時間：<span id="endTimeText" class="fw-semibold text-dark">-</span></div>
            </div>

            <hr class="my-4" style="border-color: var(--border-color);">

            <form id="voteForm" onsubmit="handleVoteSubmit(event)">
                <div class="mb-4">
                    <label class="form-label fw-bold text-dark">
                        學校 Email：<span class="text-danger">*</span>
                    </label>
                    <input type="email" id="vEmail" class="form-control" placeholder="例如：1234567@tshcmc.edu.vn" required>
                    <div class="form-text text-muted mt-1">
                        必須使用學校官方帳號 (<code>@tshcmc.edu.vn</code>) 進行實名驗證與憑證接收。
                    </div>
                </div>

                <!-- 動態生成的選項或輸入框區域 -->
                <div id="dynamicInputArea" class="mb-4"></div>

                <button type="submit" id="vSubmitBtn" class="btn btn-submit">
                    確認送出並寄送確認信
                </button>
            </form>
        </div>
    </main>

    <!-- 底部著作權標籤 -->
    <footer class="ref-footer">
        胡志明市台灣學校學生會 TSSC13TH © 2026 yucheng
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const GAS_API = "https://script.google.com/macros/s/AKfycbz3YUvaNzi4Ed3JfUSgdHtVQinjB30wMISJamSwK7OSn9wWFIyO_60na0myOdXBTLVe/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const proposalId = urlParams.get('id');

        let proposalTimeData = { startTime: null, endTime: null };
        let isProposalActive = false; // 紀錄提案是否處於可投票狀態

        /**
         * 強大且精確的時間解析器，精確解析越南時間 (GMT+7) 轉為前端 Date 物件
         */
        function parseDate(dateStr) {
            if (!dateStr) return null;
            let str = String(dateStr).trim();
            if (!str) return null;

            const numbers = str.match(/\d+/g);
            if (!numbers || numbers.length < 3) return null;

            let year = parseInt(numbers[0], 10);
            let month = String(numbers[1]).padStart(2, '0');
            let day = String(numbers[2]).padStart(2, '0');
            let hours = numbers[3] ? parseInt(numbers[3], 10) : 0;
            let minutes = numbers[4] ? String(numbers[4]).padStart(2, '0') : "00";
            let seconds = numbers[5] ? String(numbers[5]).padStart(2, '0') : "00";

            // 處理 下午 / PM
            if (/下午|PM|pm/.test(str) && hours < 12) hours += 12;
            if (/上午|AM|am/.test(str) && hours === 12) hours = 0;

            const hoursStr = String(hours).padStart(2, '0');

            // 組合成帶有 GMT+7 時區標註的標準 ISO 字串
            const isoString = `${year}-${month}-${day}T${hoursStr}:${minutes}:${seconds}+07:00`;
            const d = new Date(isoString);

            return isNaN(d.getTime()) ? null : d;
        }

        async function initVotePage() {
            if (!proposalId) { 
                alert("未指定提案 ID！");
                window.location.href = "index.html"; 
                return; 
            }

            try {
                const res = await fetch(`${GAS_API}?action=getProposals`);
                const proposals = await res.json();
                const currentP = proposals.find(p => String(p.id) === String(proposalId));

                if (currentP) {
                    document.getElementById("pTitle").innerText = currentP.title;
                    document.getElementById("pDesc").innerText = currentP.description || "無詳細說明";
                    
                    proposalTimeData.startTime = parseDate(currentP.startTime);
                    proposalTimeData.endTime = parseDate(currentP.endTime);

                    if (currentP.startTime || currentP.endTime) {
                        document.getElementById("startTimeText").innerText = currentP.startTime || "-";
                        document.getElementById("endTimeText").innerText = currentP.endTime || "-";
                        document.getElementById("timeInfoArea").classList.remove("d-none");
                    }

                    const now = new Date();
                    const badge = document.getElementById("statusBadge");
                    const submitBtn = document.getElementById("vSubmitBtn");

                    // 優先採用後端計算好的 status，若後端傳回 closed / inactive 則直接鎖定
                    const backendStatus = String(currentP.status || "").toLowerCase();

                    if (backendStatus === "closed" || backendStatus === "inactive" || (proposalTimeData.endTime && now > proposalTimeData.endTime)) {
                        badge.className = "badge bg-danger";
                        badge.innerText = "🔒 已截止";
                        submitBtn.disabled = true;
                        submitBtn.innerText = "🔒 投票時間已截止";
                        isProposalActive = false;
                    } else if (backendStatus === "upcoming" || (proposalTimeData.startTime && now < proposalTimeData.startTime)) {
                        badge.className = "badge bg-warning text-dark";
                        badge.innerText = "⏳ 尚未開放";
                        submitBtn.disabled = true;
                        submitBtn.innerText = "🔒 該項目尚未開放投票";
                        isProposalActive = false;
                    } else {
                        badge.className = "badge bg-success";
                        badge.innerText = "🟢 開放中";
                        submitBtn.disabled = false;
                        submitBtn.innerText = "確認送出並寄送確認信";
                        isProposalActive = true;
                    }

                    const inputArea = document.getElementById("dynamicInputArea");

                    if (currentP.type === "feedback") {
                        inputArea.innerHTML = `
                            <label class="form-label fw-bold text-dark">
                                您的意見與建議：<span class="text-danger">*</span>
                            </label>
                            <textarea id="vFeedbackText" class="form-control" rows="5" placeholder="請詳細寫下您的想法與建言..." required></textarea>
                        `;
                    } else {
                        const options = (currentP.options && currentP.options.length > 0) ? currentP.options : ["同意", "不同意"];
                        const optionsHTML = options.map((opt, idx) => `
                            <label class="option-label">
                                <input type="radio" name="choice" value="${escapeHtml(opt)}" ${idx === 0 ? 'checked' : ''} required> 
                                <span>${escapeHtml(opt)}</span>
                            </label>
                        `).join('');
                        
                        inputArea.innerHTML = `<label class="form-label fw-bold text-dark mb-2">請選擇您的意向：<span class="text-danger">*</span></label>` + optionsHTML;
                    }
                } else {
                    document.getElementById("pTitle").innerText = "找不到該提案";
                    document.getElementById("pDesc").innerText = "請返回首頁重新選擇項目。";
                    document.getElementById("voteForm").style.display = "none";
                }
            } catch (err) {
                console.error(err);
                alert("載入資料錯誤，請確認網路連線！");
            }
        }

        async function handleVoteSubmit(e) {
            e.preventDefault();

            const now = new Date();
            if (proposalTimeData.startTime && now < proposalTimeData.startTime) {
                alert("⚠️ 該項目尚未開放投票！");
                return;
            }
            if (proposalTimeData.endTime && now > proposalTimeData.endTime) {
                alert("⚠️ 投票時間已截止，無法繼續提交！");
                return;
            }

            const btn = document.getElementById("vSubmitBtn");
            const emailInput = document.getElementById("vEmail");
            const email = emailInput.value.trim().toLowerCase();

            if (!email.endsWith("@tshcmc.edu.vn")) {
                alert("請使用學校官方信箱 (@tshcmc.edu.vn) 進行登錄！");
                emailInput.focus();
                return;
            }

            let content = "";
            const feedbackInput = document.getElementById("vFeedbackText");
            
            if (feedbackInput) {
                content = feedbackInput.value.trim();
                if (!content) {
                    alert("請填寫您的意見內容！");
                    return;
                }
            } else {
                const selectedRadio = document.querySelector('input[name="choice"]:checked');
                if (selectedRadio) content = selectedRadio.value;
            }

            btn.disabled = true;
            btn.style.opacity = "0.7";
            btn.innerText = "⏳ 提交中，請稍候...";

            const payload = {
                action: "vote",
                proposal_id: proposalId,
                content: content,
                email: email
            };

            try {
                const res = await fetch(GAS_API, { 
                    method: "POST", 
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    redirect: "follow",
                    body: JSON.stringify(payload) 
                });
                const result = await res.json();

                if (result.success) {
                    alert("🎉 " + result.message);
                    window.location.href = "results.html";
                } else {
                    alert("⚠ 提交失敗：" + result.message);
                    if (isProposalActive) {
                        btn.disabled = false;
                        btn.style.opacity = "1";
                        btn.innerText = "確認送出並寄送確認信";
                    }
                }
            } catch (err) {
                console.error(err);
                alert("連線失敗或後端回傳格式錯誤，請稍後再試！");
                if (isProposalActive) {
                    btn.disabled = false;
                    btn.style.opacity = "1";
                    btn.innerText = "確認送出並寄送確認信";
                }
            }
        }

        function escapeHtml(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        initVotePage();
    </script>
</body>
</html>
