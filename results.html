<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胡台校學生會 - 開票與歷史結果</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="ref-navbar">
        <div class="ref-nav-container">
            <a href="index.html" class="ref-nav-brand">
                <img src="tpshcmcsc.png" alt="會徽" class="ref-logo-img">
                <span class="ref-brand-text">TPSHCMCSC 公投專區</span>
            </a>
            <div class="ref-nav-links">
                <a href="index.html" class="ref-nav-item">公投首頁</a>
                <a href="results.html" class="ref-nav-item active">開票與歷史結果</a>
                <a href="admin.html" class="ref-nav-item ref-admin-btn">⚙️ 後台管理</a>
            </div>
        </div>
    </nav>

    <main class="ref-container">
        <h2 class="ref-section-title">📊 開票與歷史公投結果</h2>
        <div id="resultsList" class="ref-proposal-grid">
            <p style="text-align: center; color: #64748b; grid-column: 1/-1; padding: 40px;">開票結果載入中...</p>
        </div>
    </main>

    <script>
        const GAS_API = "https://script.google.com/macros/s/AKfycbz3YUvaNzi4Ed3JfUSgdHtVQinjB30wMISJamSwK7OSn9wWFIyO_60na0myOdXBTLVe/exec";

        async function loadResults() {
            const container = document.getElementById("resultsList");
            try {
                const res = await fetch(`${GAS_API}?action=getResults`);
                const results = await res.json();

                if (!results || results.length === 0) {
                    container.innerHTML = `
                        <div style="grid-column: 1/-1; background: white; border: 2px dashed #cbd5e1; border-radius: 12px; padding: 50px 20px; text-align: center; color: #64748b;">
                            📭 目前尚無已開票的紀錄
                        </div>`;
                    return;
                }

                container.innerHTML = results.map(r => {
                    const total = (r.agree || 0) + (r.disagree || 0);
                    const agreeRatio = total > 0 ? ((r.agree / total) * 100).toFixed(1) : 0;
                    
                    return `
                        <div class="ref-card">
                            <h3 class="ref-card-title">${r.title}</h3>
                            <div style="margin: 15px 0;">
                                <div style="display:flex; justify-content:space-between; margin-bottom:5px; font-weight:bold;">
                                    <span>同意：${r.agree || 0} 票</span>
                                    <span>${agreeRatio}%</span>
                                </div>
                                <div style="background:#e2e8f0; border-radius:8px; height:12px; overflow:hidden;">
                                    <div style="background:#059669; width:${agreeRatio}%; height:100%;"></div>
                                </div>
                                <div style="margin-top: 10px; font-size: 0.9em; color:#64748b;">
                                    不同意：${r.disagree || 0} 票
                                </div>
                            </div>
                            <p style="font-size:0.85em; color:#94a3b8; text-align:right; margin:0;">總投票數：${total} 票</p>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                container.innerHTML = `<p style="grid-column: 1/-1; color: #ef4444; text-align: center;">開票結果載入失敗。</p>`;
            }
        }

        loadResults();
    </script>
</body>
</html>
