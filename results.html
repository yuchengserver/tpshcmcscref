<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胡志明市臺灣學校學生會 - 學生會公投專區 (開票與統計結果)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8fafc;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-yellow: #eab308;
            --btn-primary: #0f172a;
            --btn-primary-hover: #1e293b;
        }

        body {
            background-color: var(--bg-main);
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
        }

        /* 頂部導覽列 */
        .ref-navbar {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .ref-nav-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ref-nav-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 800;
            font-size: 1.1rem;
        }

        .ref-nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .ref-nav-item {
            text-decoration: none;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .ref-nav-item:hover, .ref-nav-item.active {
            color: var(--text-dark);
            background-color: #f1f5f9;
        }

        .ref-admin-btn {
            background-color: #fef9c3;
            color: #854d0e;
        }

        .ref-admin-btn:hover {
            background-color: #fef08a;
            color: #713f12;
        }

        /* 置中 Hero 區塊 */
        .hero-section {
            text-align: center;
            padding: 40px 20px 20px 20px;
        }

        .hero-icon {
            font-size: 2.8rem;
            margin-bottom: 8px;
            display: inline-block;
        }

        .hero-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .hero-subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 0;
        }

        /* 主內容容器 */
        .ref-container {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 20px 60px 20px;
        }

        /* 卡片風格 */
        .ref-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            margin-bottom: 24px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .ref-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.06);
        }

        .ref-badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 0.78rem;
            font-weight: 700;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .badge-poll { background: #e0f2fe; color: #0369a1; }
        .badge-feedback { background: #dcfce7; color: #15803d; }

        .ref-card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-top: 0;
            margin-bottom: 12px;
        }

        .feedback-box {
            background: #f8fafc;
            border-left: 4px solid #10b981;
            padding: 12px 14px;
            margin-bottom: 10px;
            border-radius: 0 8px 8px 0;
            font-size: 0.92rem;
            color: #334155;
        }

        .opt-progress-bar {
            background: #f1f5f9;
            border-radius: 8px;
            height: 10px;
            overflow: hidden;
            margin-top: 6px;
        }

        .opt-progress-fill {
            background: #059669;
            height: 100%;
            border-radius: 8px;
            transition: width 0.4s ease;
        }

        .refresh-btn {
            background-color: var(--btn-primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .refresh-btn:hover {
            background-color: var(--btn-primary-hover);
            color: #ffffff;
        }

        @media (max-width: 576px) {
            .ref-nav-container {
                flex-direction: column;
                gap: 10px;
            }
            .hero-title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- 頂部滿版導覽列 -->
    <nav class="ref-navbar">
        <div class="ref-nav-container">
            <a href="index.html" class="ref-nav-brand">
                <span>🗳️ 學生會公投專區</span>
            </a>
            <div class="ref-nav-links">
                <a href="index.html" class="ref-nav-item">首頁</a>
                <a href="results.html" class="ref-nav-item active">開票與歷史結果</a>
                <a href="admin.html" class="ref-nav-item ref-admin-btn">⚙️ 管理後台</a>
            </div>
        </div>
    </nav>

    <!-- Hero 區塊 -->
    <header class="hero-section">
        <div class="hero-icon">📊</div>
        <h1 class="hero-title">開票與歷史結果</h1>
        <p class="hero-subtitle">胡志明市臺灣學校學生會 - 學生會公投網站</p>
    </header>

    <!-- 主要內容區 -->
    <main class="ref-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h5 fw-bold text-dark m-0">即時開票與建言列表</h2>
            <button onclick="loadResults()" class="btn refresh-btn">
                🔄 重新整理
            </button>
        </div>

        <div id="resultsList">
            <div class="text-center py-5 bg-white border rounded-3" style="border-color: var(--border-color) !important;">
                <div class="spinner-border text-dark" role="status"></div>
                <p class="mt-2 text-muted small mb-0">開票結果載入中...</p>
            </div>
        </div>
    </main>

    <script>
        const GAS_API = "https://script.google.com/macros/s/AKfycbz3YUvaNzi4Ed3JfUSgdHtVQinjB30wMISJamSwK7OSn9wWFIyO_60na0myOdXBTLVe/exec";

        async function loadResults() {
            const container = document.getElementById("resultsList");
            try {
                // 完全不需要帶入密碼
                const res = await fetch(`${GAS_API}?action=getResults`);
                const results = await res.json();

                if (!results || !Array.isArray(results) || results.length === 0) {
                    container.innerHTML = `
                        <div class="bg-white border rounded-3 p-5 text-center text-muted" style="border-style: dashed !important;">
                            📭 目前尚無已開票的紀錄
                        </div>`;
                    return;
                }

                container.innerHTML = results.map(r => {
                    const isFeedback = r.type === "feedback";

                    if (isFeedback) {
                        const feedbackList = r.feedbacks || [];
                        let feedbackHtml = "";

                        if (feedbackList.length > 0) {
                            feedbackHtml = feedbackList.map(fb => `
                                <div class="feedback-box">
                                    <div>${escapeHtml(fb.content)}</div>
                                    <div style="font-size:0.75em; color:#94a3b8; text-align:right; margin-top:4px;">${escapeHtml(fb.time || '')}</div>
                                </div>
                            `).join('');
                        } else {
                            feedbackHtml = `<p style="color:#94a3b8; font-size:0.9em; text-align:center; margin:15px 0;">目前暫無學生建言</p>`;
                        }

                        return `
                            <div class="ref-card">
                                <div>
                                    <span class="ref-badge badge-feedback">💡 意見徵集</span>
                                    <h3 class="ref-card-title">${escapeHtml(r.title)}</h3>
                                    <div style="max-height: 260px; overflow-y: auto; margin: 15px 0; padding-right: 4px;">
                                        ${feedbackHtml}
                                    </div>
                                </div>
                                <div style="font-size:0.85em; color:#64748b; text-align:right; border-top: 1px solid #f1f5f9; padding-top: 10px; margin-top: 10px;">
                                    收到總建言數：<strong>${r.total_responses || 0}</strong> 筆
                                </div>
                            </div>
                        `;
                    } else {
                        const total = r.total_votes || 0;
                        const counts = r.options_count || {};
                        const options = Object.keys(counts);

                        let optionsHtml = "";

                        if (options.length > 0) {
                            optionsHtml = options.map(opt => {
                                const votes = counts[opt] || 0;
                                const ratio = total > 0 ? ((votes / total) * 100).toFixed(1) : "0.0";
                                return `
                                    <div style="margin-bottom: 14px;">
                                        <div style="display:flex; justify-content:space-between; font-size:0.95em; font-weight:600; color:#334155;">
                                            <span>${escapeHtml(opt)}: ${votes} 票</span>
                                            <span>${ratio}%</span>
                                        </div>
                                        <div class="opt-progress-bar">
                                            <div class="opt-progress-fill" style="width: ${ratio}%;"></div>
                                        </div>
                                    </div>
                                `;
                            }).join('');
                        } else {
                            optionsHtml = `<p style="color:#94a3b8; font-size:0.9em; text-align:center; margin:15px 0;">尚無投票數據</p>`;
                        }

                        return `
                            <div class="ref-card">
                                <div>
                                    <span class="ref-badge badge-poll">🗳️ 選項投票</span>
                                    <h3 class="ref-card-title">${escapeHtml(r.title)}</h3>
                                    <div style="margin: 15px 0;">
                                        ${optionsHtml}
                                    </div>
                                </div>
                                <div style="font-size:0.85em; color:#64748b; text-align:right; border-top: 1px solid #f1f5f9; padding-top: 10px; margin-top: 10px;">
                                    總投票數：<strong>${total}</strong> 票
                                </div>
                            </div>
                        `;
                    }
                }).join('');

            } catch (err) {
                container.innerHTML = `<div class="alert alert-danger text-center py-4">開票結果載入失敗，請確認網路連線。</div>`;
            }
        }

        function escapeHtml(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        loadResults();
    </script>
</body>
</html>
