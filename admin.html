<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胡志明市臺灣學校學生會 - 後台管理系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8fafc;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --btn-primary: #0f172a;
            --btn-primary-hover: #1e293b;
        }

        body {
            background-color: var(--bg-main);
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .ref-navbar {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .ref-nav-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ref-nav-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 800;
            font-size: 1.1rem;
        }

        .ref-nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .ref-nav-item {
            text-decoration: none;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .ref-nav-item:hover, .ref-nav-item.active {
            color: var(--text-dark);
            background-color: #f1f5f9;
        }

        .ref-admin-btn {
            background-color: #fef9c3;
            color: #854d0e;
        }

        .hero-section {
            text-align: center;
            padding: 40px 20px 20px 20px;
        }

        .hero-icon {
            font-size: 2.8rem;
            margin-bottom: 8px;
            display: inline-block;
        }

        .hero-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .hero-subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
        }

        .ref-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 20px 60px 20px;
            flex: 1;
        }

        .ref-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
        }

        .form-label {
            font-weight: 700;
            color: var(--text-dark);
        }

        .btn-submit {
            background-color: var(--btn-primary);
            color: #ffffff;
            font-weight: 700;
            padding: 12px;
            border-radius: 8px;
            border: none;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--btn-primary-hover);
            color: #ffffff;
        }

        .notice-banner {
            background-color: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 12px 16px;
            color: #0369a1;
            font-size: 0.88rem;
            margin-bottom: 24px;
        }

        .ref-footer {
            text-align: center;
            padding: 20px 0;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            background-color: #ffffff;
            margin-top: auto;
        }

        @media (max-width: 576px) {
            .ref-nav-container {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <nav class="ref-navbar">
        <div class="ref-nav-container">
            <a href="index.html" class="ref-nav-brand nav-leave">
                <span>TSSC13TH 公投專區</span>
            </a>
            <div class="ref-nav-links">
                <a href="index.html" class="ref-nav-item nav-leave">🏫 首頁與通知</a>
                <a href="results.html" class="ref-nav-item nav-leave">📊 開票與歷史結果</a>
                <a href="admin.html" class="ref-nav-item ref-admin-btn active">⚙️ 管理員後台</a>
            </div>
        </div>
    </nav>

    <header class="hero-section">
        <div class="hero-icon">⚙️</div>
        <h1 class="hero-title">後台管理系統</h1>
        <p class="hero-subtitle">胡志明市臺灣學校學生會 - 發布新提案與意見徵集</p>
    </header>

    <main class="ref-container">

        <!-- 密碼登入驗證卡片 -->
        <div id="loginSection" class="ref-card text-center">
            <h3 class="h5 fw-bold mb-3">🔒 管理員身份驗證</h3>
            <p class="text-muted small mb-4">請輸入後台管理密碼以存取提案發布功能。</p>
            <form onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <input type="password" id="adminPassword" class="form-control text-center" placeholder="請輸入管理員密碼" required>
                </div>
                <button type="submit" id="loginBtn" class="btn btn-submit">登入後台</button>
            </form>
        </div>

        <!-- 後台功能主面板 (預設隱藏) -->
        <div id="adminPanel" class="ref-card d-none">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <h3 class="h5 fw-bold m-0">➕ 發布新提案 / 意見徵集</h3>
                <button onclick="logout()" class="btn btn-outline-danger btn-sm">🚪 登出</button>
            </div>

            <!-- 時區提醒橫幅 -->
            <div class="notice-banner">
                🕒 <strong>貼心提醒：</strong>本平台所有提案之開始與截止時間均以<strong>越南時間 (GMT+7)</strong> 為準，請依照當地時間進行排程設定。
            </div>

            <form id="proposalForm" onsubmit="submitNewProposal(event)">
                <div class="mb-3">
                    <label class="form-label">提案類型</label>
                    <select id="propType" class="form-select" onchange="toggleOptionsField()" required>
                        <option value="poll">🗳️ 選項投票 (多選一/單選投票)</option>
                        <option value="feedback">💡 意見徵集 (學生自由留言)</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">提案標題</label>
                    <input type="text" id="propTitle" class="form-control" placeholder="例：2026 舞會主題投票" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">詳細說明</label>
                    <textarea id="propDesc" class="form-control" rows="3" placeholder="請說明提案背景或規則..."></textarea>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6 mb-3 mb-md-0">
                        <label class="form-label">⏰ 開始時間 (越南時間)</label>
                        <input type="datetime-local" id="propStartTime" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">⏳ 截止時間 (越南時間)</label>
                        <input type="datetime-local" id="propEndTime" class="form-control" required>
                    </div>
                </div>

                <!-- 狀態手動選擇區塊：避免時間誤差造成誤判 -->
                <div class="mb-3">
                    <label for="forceStatus" class="form-label">⚙️ 初始狀態控制</label>
                    <select id="forceStatus" class="form-select">
                        <option value="">自動依時間判定 (預設)</option>
                        <option value="active" selected>🟢 立即開放 (Active)</option>
                        <option value="upcoming">⏳ 稍後開始 (Upcoming)</option>
                        <option value="closed">🔒 手動關閉 (Closed)</option>
                    </select>
                    <small class="text-muted">若不想讓系統因時間差自動判定，可在此手動指定發布時的初始狀態。</small>
                </div>

                <div class="mb-3" id="optionsGroup">
                    <label class="form-label">投票選項 (請用半形逗號分隔)</label>
                    <input type="text" id="propOptions" class="form-control" placeholder="例：復古風, 科技風, 電影主題">
                    <small class="text-muted">僅在「選項投票」時生效，項目之間請用逗號 <code>,</code> 隔開。</small>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-submit">🚀 立即發布提案</button>
            </form>
        </div>

    </main>

    <footer class="ref-footer">
        胡志明市台灣學校學生會 TSSC13TH © 2026 yucheng
    </footer>

    <script>
        const GAS_API = "https://script.google.com/macros/s/AKfycbz3YUvaNzi4Ed3JfUSgdHtVQinjB30wMISJamSwK7OSn9wWFIyO_60na0myOdXBTLVe/exec";
        let currentAdminPassword = "";

        function checkAuth() {
            const savedPass = sessionStorage.getItem("admin_password");
            if (savedPass) {
                currentAdminPassword = savedPass;
                document.getElementById("loginSection").classList.add("d-none");
                document.getElementById("adminPanel").classList.remove("d-none");
                if (!document.getElementById("propStartTime").value) {
                    initDefaultTime();
                }
            } else {
                document.getElementById("loginSection").classList.remove("d-none");
                document.getElementById("adminPanel").classList.add("d-none");
            }
        }

        function initDefaultTime() {
            const now = new Date();
            const startStr = formatDateTimeLocal(now);
            const endDate = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
            const endStr = formatDateTimeLocal(endDate);

            document.getElementById("propStartTime").value = startStr;
            document.getElementById("propEndTime").value = endStr;
        }

        function formatDateTimeLocal(date) {
            const tzOffset = date.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(date.getTime() - tzOffset)).toISOString().slice(0, 16);
            return localISOTime;
        }

        // 嚴格後端密碼驗證登入
        async function handleLogin(e) {
            e.preventDefault();
            const passInput = document.getElementById("adminPassword").value.trim();
            if (!passInput) return;

            const loginBtn = document.getElementById("loginBtn");
            loginBtn.disabled = true;
            loginBtn.innerText = "驗證中...";

            try {
                const payload = {
                    action: "createProposal",
                    password: passInput,
                    title: "" 
                };

                const res = await fetch(GAS_API, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    redirect: "follow",
                    body: JSON.stringify(payload)
                });
                const result = await res.json();

                if (!result.success && result.message && (result.message.includes("密碼") || result.message.includes("權限"))) {
                    alert("❌ 密碼錯誤！請輸入正確的管理員密碼。");
                    document.getElementById("adminPassword").value = "";
                } else {
                    sessionStorage.setItem("admin_password", passInput);
                    currentAdminPassword = passInput;
                    document.getElementById("adminPassword").value = "";
                    checkAuth();
                }
            } catch (err) {
                alert("❌ 驗證連線失敗，請檢查網路連線。");
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerText = "登入後台";
            }
        }

        function logout() {
            sessionStorage.removeItem("admin_password");
            currentAdminPassword = "";
            checkAuth();
        }

        document.querySelectorAll(".nav-leave").forEach(el => {
            el.addEventListener("click", () => {
                sessionStorage.removeItem("admin_password");
            });
        });

        function toggleOptionsField() {
            const type = document.getElementById("propType").value;
            const optionsGroup = document.getElementById("optionsGroup");
            if (type === "feedback") {
                optionsGroup.classList.add("d-none");
            } else {
                optionsGroup.classList.remove("d-none");
            }
        }

        async function submitNewProposal(e) {
            e.preventDefault();

            const startTime = document.getElementById("propStartTime").value;
            const endTime = document.getElementById("propEndTime").value;

            if (new Date(endTime) <= new Date(startTime)) {
                alert("⚠️ 截止時間必須晚於開始時間！");
                return;
            }

            const type = document.getElementById("propType").value;
            const title = document.getElementById("propTitle").value.trim();
            const description = document.getElementById("propDesc").value.trim();
            const optionsRaw = document.getElementById("propOptions").value.trim();
            const forceStatus = document.getElementById("forceStatus").value;

            let options = [];
            if (type === "poll") {
                if (optionsRaw) {
                    options = optionsRaw.split(',').map(s => s.trim()).filter(s => s.length > 0);
                }
                // 優化 1：選項必填與數量驗證
                if (options.length < 2) {
                    alert("⚠️ 選項投票類型至少需要提供 2 個選項 (請用半形逗號分隔)！");
                    return;
                }
            }

            const btn = document.getElementById("submitBtn");
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>發布中，請稍後...`;

            const payload = {
                action: "createProposal",
                password: currentAdminPassword,
                type: type,
                title: title,
                description: description,
                options: options.join(","),
                start_time: startTime,
                end_time: endTime,
                force_status: forceStatus
            };

            try {
                const res = await fetch(GAS_API, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    redirect: "follow",
                    body: JSON.stringify(payload)
                });
                const result = await res.json();

                if (result.success) {
                    alert("✅ 提案發布成功！");
                    document.getElementById("proposalForm").reset();
                    initDefaultTime();
                    toggleOptionsField(); // 優化 2：發布後重置表單欄位顯示狀態
                } else {
                    alert("❌ 發布失敗：" + (result.message || "密碼錯誤或權限不足"));
                    if (result.message && (result.message.includes("密碼") || result.message.includes("權限"))) {
                        logout();
                    }
                }
            } catch (err) {
                alert("❌ 發布失敗，請確認網路連線或 GAS API 設定。");
            } finally {
                btn.disabled = false;
                btn.innerHTML = "🚀 立即發布提案";
            }
        }

        checkAuth();
    </script>
</body>
</html>
