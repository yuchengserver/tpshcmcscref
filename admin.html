<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胡志明市臺灣學校學生會 - 後台管理系統</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8fafc;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --btn-primary: #0f172a;
            --btn-primary-hover: #1e293b;
        }

        body {
            background-color: var(--bg-main);
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
        }

        /* 導覽列 */
        .ref-navbar {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .ref-nav-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ref-nav-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 800;
            font-size: 1.1rem;
        }

        .ref-nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .ref-nav-item {
            text-decoration: none;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .ref-nav-item:hover, .ref-nav-item.active {
            color: var(--text-dark);
            background-color: #f1f5f9;
        }

        .ref-admin-btn {
            background-color: #fef9c3;
            color: #854d0e;
        }

        /* Hero 區塊 */
        .hero-section {
            text-align: center;
            padding: 40px 20px 20px 20px;
        }

        .hero-icon {
            font-size: 2.8rem;
            margin-bottom: 8px;
            display: inline-block;
        }

        .hero-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .hero-subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
        }

        /* 主要內容容器 */
        .ref-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 20px 60px 20px;
        }

        .ref-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
        }

        .form-label {
            font-weight: 700;
            color: var(--text-dark);
        }

        .btn-submit {
            background-color: var(--btn-primary);
            color: #ffffff;
            font-weight: 700;
            padding: 12px;
            border-radius: 8px;
            border: none;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--btn-primary-hover);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列 -->
    <nav class="ref-navbar">
        <div class="ref-nav-container">
            <a href="index.html" class="ref-nav-brand">
                <span>🗳️ 學生會公投專區</span>
            </a>
            <div class="ref-nav-links">
                <a href="index.html" class="ref-nav-item">首頁</a>
                <a href="results.html" class="ref-nav-item">開票與歷史結果</a>
                <a href="admin.html" class="ref-nav-item ref-admin-btn active">⚙️ 管理後台</a>
            </div>
        </div>
    </nav>

    <!-- Hero 區塊 -->
    <header class="hero-section">
        <div class="hero-icon">⚙️</div>
        <h1 class="hero-title">後台管理系統</h1>
        <p class="hero-subtitle">胡志明市臺灣學校學生會 - 發布新提案與意見徵集</p>
    </header>

    <main class="ref-container">

        <!-- 1. 登入介面 (未驗證時顯示) -->
        <div id="loginSection" class="ref-card text-center">
            <h3 class="h5 fw-bold mb-3">🔒 管理員身份驗證</h3>
            <p class="text-muted small mb-4">請輸入後台管理密碼以存取提案發布功能。</p>
            <form onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <input type="password" id="adminPassword" class="form-control text-center" placeholder="請輸入管理員密碼" required>
                </div>
                <button type="submit" class="btn btn-submit">登入後台</button>
            </form>
        </div>

        <!-- 2. 後台新增提案表單 (登入成功後才顯示) -->
        <div id="adminPanel" class="ref-card d-none">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <h3 class="h5 fw-bold m-0">➕ 發布新提案 / 意見徵集</h3>
                <button onclick="logout()" class="btn btn-outline-danger btn-sm">🚪 登出</button>
            </div>

            <form onsubmit="submitNewProposal(event)">
                <div class="mb-3">
                    <label class="form-label">提案類型</label>
                    <select id="propType" class="form-select" onchange="toggleOptionsField()" required>
                        <option value="poll">🗳️ 選項投票 (多選一/單選投票)</option>
                        <option value="feedback">💡 意見徵集 (學生自由留言)</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">提案標題</label>
                    <input type="text" id="propTitle" class="form-control" placeholder="例：2026 舞會主題投票" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">詳細說明</label>
                    <textarea id="propDesc" class="form-control" rows="3" placeholder="請說明提案背景或規則..."></textarea>
                </div>

                <div class="mb-3" id="optionsGroup">
                    <label class="form-label">投票選項 (請用半形逗號分隔)</label>
                    <input type="text" id="propOptions" class="form-control" placeholder="例：復古風, 科技風, 電影主題">
                    <small class="text-muted">僅在「選項投票」時生效，項目之間請用逗號 <code>,</code> 隔開。</small>
                </div>

                <div class="mb-4">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="propActive" checked>
                        <label class="form-check-input-label fw-bold" for="propActive">立即開放公投 / 徵集</label>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-submit">🚀 立即發布提案</button>
            </form>
        </div>

    </main>

    <script>
        const GAS_API = "https://script.google.com/macros/s/AKfycbz3YUvaNzi4Ed3JfUSgdHtVQinjB30wMISJamSwK7OSn9wWFIyO_60na0myOdXBTLVe/exec";
        let currentAdminPassword = "";

        // 初始化檢查登入狀態
        function checkAuth() {
            const savedPass = localStorage.getItem("admin_password");
            if (savedPass) {
                currentAdminPassword = savedPass;
                document.getElementById("loginSection").classList.add("d-none");
                document.getElementById("adminPanel").classList.remove("d-none");
            } else {
                document.getElementById("loginSection").classList.remove("d-none");
                document.getElementById("adminPanel").classList.add("d-none");
            }
        }

        // 處理登入
        function handleLogin(e) {
            e.preventDefault();
            const passInput = document.getElementById("adminPassword").value.trim();
            if (!passInput) return;

            localStorage.setItem("admin_password", passInput);
            currentAdminPassword = passInput;
            checkAuth();
        }

        // 登出
        function logout() {
            localStorage.removeItem("admin_password");
            currentAdminPassword = "";
            document.getElementById("adminPassword").value = "";
            checkAuth();
        }

        // 切換類型時隱藏/顯示選項輸入框
        function toggleOptionsField() {
            const type = document.getElementById("propType").value;
            const optionsGroup = document.getElementById("optionsGroup");
            if (type === "feedback") {
                optionsGroup.classList.add("d-none");
            } else {
                optionsGroup.classList.remove("d-none");
            }
        }

        // 提交新提案
        async function submitNewProposal(e) {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            btn.disabled = true;
            btn.innerText = "發布中，請稍後...";

            const type = document.getElementById("propType").value;
            const title = document.getElementById("propTitle").value.trim();
            const description = document.getElementById("propDesc").value.trim();
            const optionsRaw = document.getElementById("propOptions").value.trim();
            const isActive = document.getElementById("propActive").checked;

            // 整理選項為陣列
            let options = [];
            if (type === "poll" && optionsRaw) {
                options = optionsRaw.split(',').map(s => s.trim()).filter(s => s.length > 0);
            }

            const payload = {
                action: "addProposal",
                password: currentAdminPassword,
                type: type,
                title: title,
                description: description,
                options: options,
                active: isActive
            };

            try {
                const res = await fetch(GAS_API, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const result = await res.json();

                if (result.status === "success") {
                    alert("✅ 提案發布成功！");
                    location.reload();
                } else {
                    alert("❌ 發布失敗：" + (result.message || "密碼錯誤或服務器異常"));
                    if (result.message && result.message.includes("密碼")) {
                        logout();
                    }
                }
            } catch (err) {
                alert("❌ 發布失敗，請確認網路連線或 GAS API 設定。");
            } finally {
                btn.disabled = false;
                btn.innerText = "🚀 立即發布提案";
            }
        }

        // 頁面載入時驗證
        checkAuth();
    </script>
</body>
</html>
