<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胡志明市臺灣學校學生會 - 參與表達</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8fafc;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --btn-primary: #0f172a;
            --btn-primary-hover: #1e293b;
            --accent-blue: #2563eb;
            --accent-blue-light: #eff6ff;
        }

        body {
            background-color: var(--bg-main);
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
        }

        /* 頂部導覽列 */
        .ref-navbar {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .ref-nav-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ref-nav-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 800;
            font-size: 1.1rem;
        }

        .ref-logo-img {
            height: 32px;
            width: auto;
            margin-right: 10px;
        }

        .ref-nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .ref-nav-item {
            text-decoration: none;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .ref-nav-item:hover, .ref-nav-item.active {
            color: var(--text-dark);
            background-color: #f1f5f9;
        }

        .ref-admin-btn {
            background-color: #fef9c3;
            color: #854d0e;
        }

        .ref-admin-btn:hover {
            background-color: #fef08a;
            color: #713f12;
        }

        /* 內容主要容器 */
        .ref-container {
            max-width: 680px;
            margin: 40px auto;
            padding: 0 20px 60px 20px;
        }

        /* 卡片面板 */
        .ref-vote-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
        }

        /* 單選選項卡片 */
        .option-label {
            display: flex;
            align-items: center;
            border: 1.5px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-dark);
            transition: all 0.2s ease;
            background-color: #ffffff;
        }

        .option-label:hover {
            border-color: var(--accent-blue);
            background-color: #f8fafc;
        }

        .option-label input[type="radio"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            accent-color: var(--accent-blue);
        }

        .option-label:has(input[type="radio"]:checked) {
            border-color: var(--accent-blue);
            background-color: var(--accent-blue-light);
            color: #1e40af;
        }

        .form-control {
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: var(--btn-primary);
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1);
        }

        .btn-submit {
            background-color: var(--btn-primary);
            color: #ffffff;
            border-radius: 8px;
            padding: 14px;
            font-weight: 700;
            font-size: 1.05rem;
            border: none;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--btn-primary-hover);
            color: #ffffff;
        }

        @media (max-width: 576px) {
            .ref-nav-container {
                flex-direction: column;
                gap: 10px;
            }
            .ref-vote-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- 頂部滿版導覽列 -->
    <nav class="ref-navbar">
        <div class="ref-nav-container">
            <a href="index.html" class="ref-nav-brand">
                <img src="tpshcmcsc.png" alt="會徽" class="ref-logo-img">
                <span class="ref-brand-text">🗳️ 學生會公投專區</span>
            </a>
            <div class="ref-nav-links">
                <a href="index.html" class="ref-nav-item">首頁</a>
                <a href="results.html" class="ref-nav-item">開票與歷史結果</a>
                <a href="admin.html" class="ref-nav-item ref-admin-btn">⚙️ 管理後台</a>
            </div>
        </div>
    </nav>

    <!-- 主要內容卡片區塊 -->
    <main class="ref-container">
        <div class="ref-vote-card">
            <h2 id="pTitle" class="fw-bold text-dark mb-2 fs-3">載入提案中...</h2>
            <p id="pDesc" class="text-secondary mb-4 fs-6">請稍候，正在取得提案內容...</p>
            
            <hr class="my-4" style="border-color: var(--border-color);">

            <form id="voteForm" onsubmit="handleVoteSubmit(event)">
                <div class="mb-4">
                    <label class="form-label fw-bold text-dark">
                        學校 Email：<span class="text-danger">*</span>
                    </label>
                    <input type="email" id="vEmail" class="form-control" placeholder="例如：1141218@tshcmc.edu.vn" required>
                    <div class="form-text text-muted mt-1">
                        必須使用學校官方帳號 (<code>@tshcmc.edu.vn</code>)
                    </div>
                </div>

                <!-- 動態生成的選項或輸入框區域 -->
                <div id="dynamicInputArea" class="mb-4"></div>

                <button type="submit" id="vSubmitBtn" class="btn btn-submit">
                    確認送出並寄送確認信
                </button>
            </form>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const GAS_API = "https://script.google.com/macros/s/AKfycbz3YUvaNzi4Ed3JfUSgdHtVQinjB30wMISJamSwK7OSn9wWFIyO_60na0myOdXBTLVe/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const proposalId = urlParams.get('id');

        async function initVotePage() {
            if (!proposalId) { 
                alert("未指定提案 ID！");
                window.location.href = "index.html"; 
                return; 
            }

            try {
                const res = await fetch(`${GAS_API}?action=getProposals`);
                const proposals = await res.json();
                const currentP = proposals.find(p => String(p.id) === String(proposalId));

                if (currentP) {
                    document.getElementById("pTitle").innerText = currentP.title;
                    document.getElementById("pDesc").innerText = currentP.description || "無詳細說明";
                    
                    const inputArea = document.getElementById("dynamicInputArea");

                    if (currentP.type === "feedback") {
                        // 💬 意見徵集模式：顯示多行文字框
                        inputArea.innerHTML = `
                            <label class="form-label fw-bold text-dark">
                                您的意見與建議：<span class="text-danger">*</span>
                            </label>
                            <textarea id="vFeedbackText" class="form-control" rows="5" placeholder="請詳細寫下您的想法與建言..." required></textarea>
                        `;
                    } else {
                        // 🗳 投票選項模式：顯示單選按鈕
                        const options = (currentP.options && currentP.options.length > 0) ? currentP.options : ["同意", "不同意"];
                        const optionsHTML = options.map((opt, idx) => `
                            <label class="option-label">
                                <input type="radio" name="choice" value="${escapeHtml(opt)}" ${idx === 0 ? 'checked' : ''} required> 
                                <span>${escapeHtml(opt)}</span>
                            </label>
                        `).join('');
                        
                        inputArea.innerHTML = `<label class="form-label fw-bold text-dark mb-2">請選擇您的意向：<span class="text-danger">*</span></label>` + optionsHTML;
                    }
                } else {
                    document.getElementById("pTitle").innerText = "找不到該提案";
                    document.getElementById("pDesc").innerText = "請返回首頁重新選擇項目。";
                    document.getElementById("voteForm").style.display = "none";
                }
            } catch (err) {
                alert("載入資料錯誤，請確認網路連線！");
            }
        }

        async function handleVoteSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById("vSubmitBtn");
            const emailInput = document.getElementById("vEmail");
            const email = emailInput.value.trim().toLowerCase();

            // 驗證 Email Domain
            if (!email.endsWith("@tshcmc.edu.vn")) {
                alert("請使用學校官方信箱 (@tshcmc.edu.vn) 進行登錄！");
                emailInput.focus();
                return;
            }

            let content = "";
            const feedbackInput = document.getElementById("vFeedbackText");
            
            if (feedbackInput) {
                content = feedbackInput.value.trim();
                if (!content) {
                    alert("請填寫您的意見內容！");
                    return;
                }
            } else {
                const selectedRadio = document.querySelector('input[name="choice"]:checked');
                if (selectedRadio) content = selectedRadio.value;
            }

            // 鎖定按鈕防止重複提交
            btn.disabled = true;
            btn.style.opacity = "0.7";
            btn.innerText = "⏳ 提交中，請稍候...";

            const payload = {
                action: "vote",
                proposal_id: proposalId,
                content: content,
                email: email
            };

            try {
                const res = await fetch(GAS_API, { 
                    method: "POST", 
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload) 
                });
                const result = await res.json();

                if (result.success) {
                    alert("🎉 " + result.message);
                    window.location.href = "results.html";
                } else {
                    alert("⚠️ 提交失敗：" + result.message);
                }
            } catch (err) {
                alert("連線失敗，請稍後再試！");
            } finally {
                btn.disabled = false;
                btn.style.opacity = "1";
                btn.innerText = "確認送出並寄送確認信";
            }
        }

        // 防 XSS 攻擊字元轉義
        function escapeHtml(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        initVotePage();
    </script>
</body>
</html>
