<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胡台校學生會 - 參與表達</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="ref-navbar">
        <div class="ref-nav-container">
            <a href="index.html" class="ref-nav-brand">
                <img src="tpshcmcsc.png" alt="會徽" class="ref-logo-img">
                <span class="ref-brand-text">TPSHCMCSC 專區</span>
            </a>
        </div>
    </nav>

    <main class="ref-container" style="max-width: 600px; margin: 40px auto;">
        <div class="ref-info-box">
            <h2 id="pTitle" style="color:#0f172a; margin-bottom: 12px;">載入中...</h2>
            <p id="pDesc" style="color:#475569; margin-bottom: 20px; font-size: 1rem;">請稍候...</p>
            <hr style="border: none; border-top: 1px solid #e2e8f0; margin-bottom: 20px;">

            <form id="voteForm" onsubmit="handleVoteSubmit(event)">
                <div style="margin-bottom: 15px;">
                    <label style="display:block; margin-bottom: 5px; font-weight:bold;">學生 Email：</label>
                    <input type="email" id="vEmail" placeholder="s123456@tpshcm.edu.vn" required style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;">
                </div>

                <!-- 動態生成的選項或輸入框區域 -->
                <div id="dynamicInputArea" style="margin-bottom: 20px;"></div>

                <button type="submit" id="vSubmitBtn" class="ref-vote-btn" style="padding: 12px; font-size: 1.05rem;">確認送出並寄送確認信</button>
            </form>
        </div>
    </main>

    <script>
        const GAS_API = "https://script.google.com/macros/s/AKfycbz3YUvaNzi4Ed3JfUSgdHtVQinjB30wMISJamSwK7OSn9wWFIyO_60na0myOdXBTLVe/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const proposalId = urlParams.get('id');

        async function initVotePage() {
            if (!proposalId) { window.location.href = "index.html"; return; }

            try {
                const res = await fetch(`${GAS_API}?action=getProposals`);
                const proposals = await res.json();
                const currentP = proposals.find(p => String(p.id) === String(proposalId));

                if (currentP) {
                    document.getElementById("pTitle").innerText = currentP.title;
                    document.getElementById("pDesc").innerText = currentP.description;
                    
                    const inputArea = document.getElementById("dynamicInputArea");

                    if (currentP.type === "feedback") {
                        // 💬 意見徵集模式：顯示多行文字框
                        inputArea.innerHTML = `
                            <label style="display:block; margin-bottom: 8px; font-weight:bold;">您的意見與建議：</label>
                            <textarea id="vFeedbackText" rows="5" placeholder="請寫下您的想法與建議..." required style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;"></textarea>
                        `;
                    } else {
                        // 🗳️ 投票選項模式：顯示單選按鈕
                        const options = currentP.options.length > 0 ? currentP.options : ["同意", "不同意"];
                        const optionsHTML = options.map(opt => `
                            <label style="display: flex; align-items: center; border: 2px solid #cbd5e1; padding: 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-weight: bold;">
                                <input type="radio" name="choice" value="${opt}" required style="margin-right: 10px;"> ${opt}
                            </label>
                        `).join('');
                        
                        inputArea.innerHTML = `<label style="display:block; margin-bottom: 8px; font-weight:bold;">請選擇您的意向：</label>` + optionsHTML;
                    }
                }
            } catch (err) {
                alert("載入資料錯誤");
            }
        }

        async function handleVoteSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById("vSubmitBtn");
            btn.disabled = true;
            btn.innerText = "提交處理中...";

            const email = document.getElementById("vEmail").value;
            let content = "";

            const feedbackInput = document.getElementById("vFeedbackText");
            if (feedbackInput) {
                content = feedbackInput.value;
            } else {
                const selectedRadio = document.querySelector('input[name="choice"]:checked');
                if (selectedRadio) content = selectedRadio.value;
            }

            const payload = {
                action: "vote",
                proposal_id: proposalId,
                content: content,
                email: email
            };

            try {
                const res = await fetch(GAS_API, { method: "POST", body: JSON.stringify(payload) });
                const result = await res.json();

                if (result.success) {
                    alert("✅ " + result.message);
                    window.location.href = "results.html";
                } else {
                    alert("❌ 失敗：" + result.message);
                }
            } catch (err) {
                alert("連線失敗");
            } finally {
                btn.disabled = false;
                btn.innerText = "確認送出並寄送確認信";
            }
        }

        initVotePage();
    </script>
</body>
</html>
