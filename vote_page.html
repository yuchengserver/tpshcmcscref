<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胡台校學生會 - 進行投票</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="ref-navbar">
        <div class="ref-nav-container">
            <a href="index.html" class="ref-nav-brand">
                <img src="tpshcmcsc.png" alt="會徽" class="ref-logo-img">
                <span class="ref-brand-text">TPSHCMCSC 公投專區</span>
            </a>
            <div class="ref-nav-links">
                <a href="index.html" class="ref-nav-item">公投首頁</a>
                <a href="results.html" class="ref-nav-item">開票與歷史結果</a>
                <a href="admin.html" class="ref-nav-item ref-admin-btn">⚙️ 後台管理</a>
            </div>
        </div>
    </nav>

    <main class="ref-container" style="max-width: 600px; margin: 40px auto;">
        <div class="ref-info-box" id="voteCard">
            <h2 id="pTitle" style="color:#0f172a; margin-bottom: 12px;">載入中...</h2>
            <p id="pDesc" style="color:#475569; margin-bottom: 20px; font-size: 1rem;">請稍候...</p>
            <hr style="border: none; border-top: 1px solid #e2e8f0; margin-bottom: 20px;">

            <form id="voteForm" onsubmit="handleVoteSubmit(event)">
                <div class="ref-form-group">
                    <label>學生學校 Email：</label>
                    <input type="email" id="vEmail" class="ref-input" placeholder="s123456@tpshcm.edu.vn" required>
                </div>

                <div class="ref-form-group" style="margin: 20px 0;">
                    <label style="margin-bottom: 10px;">投票意向：</label>
                    <div style="display: flex; gap: 15px;">
                        <label style="flex: 1; text-align: center; border: 2px solid #cbd5e1; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold;">
                            <input type="radio" name="choice" value="同意" required style="margin-right: 5px;"> 同意
                        </label>
                        <label style="flex: 1; text-align: center; border: 2px solid #cbd5e1; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold;">
                            <input type="radio" name="choice" value="不同意" required style="margin-right: 5px;"> 不同意
                        </label>
                    </div>
                </div>

                <button type="submit" id="vSubmitBtn" class="ref-vote-btn" style="padding: 12px; font-size: 1.05rem;">確認投遞選票</button>
            </form>
        </div>
    </main>

    <script>
        const GAS_API = "https://script.google.com/macros/s/AKfycbz3YUvaNzi4Ed3JfUSgdHtVQinjB30wMISJamSwK7OSn9wWFIyO_60na0myOdXBTLVe/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const proposalId = urlParams.get('id');

        async function initVotePage() {
            if (!proposalId) {
                alert("無效的提案頁面");
                window.location.href = "index.html";
                return;
            }

            try {
                const res = await fetch(`${GAS_API}?action=getProposals`);
                const proposals = await res.json();
                const currentP = proposals.find(p => String(p.id) === String(proposalId));

                if (currentP) {
                    document.getElementById("pTitle").innerText = currentP.title;
                    document.getElementById("pDesc").innerText = currentP.description;
                } else {
                    alert("找不到該提案！");
                    window.location.href = "index.html";
                }
            } catch (err) {
                alert("載入資料錯誤");
            }
        }

        async function handleVoteSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById("vSubmitBtn");
            btn.disabled = true;
            btn.innerText = "投遞選票中，並寄送確認信件...";

            const email = document.getElementById("vEmail").value;
            const choice = document.querySelector('input[name="choice"]:checked').value;

            const payload = {
                action: "vote",
                proposal_id: proposalId,
                choice: choice,
                email: email
            };

            try {
                const res = await fetch(GAS_API, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const result = await res.json();

                if (result.success) {
                    alert("✅ 投票成功！確認信件已同步發送至您的 Email。");
                    window.location.href = "results.html";
                } else {
                    alert("❌ 投票失敗：" + result.message);
                }
            } catch (err) {
                alert("連線失敗，請稍後再試。");
            } finally {
                btn.disabled = false;
                btn.innerText = "確認投遞選票";
            }
        }

        initVotePage();
    </script>
</body>
</html>
