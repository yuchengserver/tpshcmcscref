<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進行投票 - TPSHCMCSC 公投專區</title>
    <link rel="stylesheet" href="referendum_style.css">
</head>
<body>

    <nav class="ref-navbar">
        <div class="ref-nav-container">
            <a href="index.html" class="ref-nav-brand">
                <img src="tpshcmcsc.png" alt="會徽" class="ref-logo-img">
                <span class="ref-brand-text">TPSHCMCSC 公投專區</span>
            </a>
            <div class="ref-nav-links">
                <a href="index.html" class="ref-nav-item">返回首頁</a>
            </div>
        </div>
    </nav>

    <main class="ref-container">
        <div class="ref-info-box" id="voteCard">
            <h2 id="proposalTitle">載入中...</h2>
            <p id="proposalDesc" style="margin: 15px 0; color: #475569;">請稍候...</p>
            <p style="font-size: 0.9rem; color: #64748b;">🕒 截止時間：<span id="proposalEndTime">-</span></p>

            <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">

            <form id="voteForm">
                <div style="margin-bottom: 15px;">
                    <label><b>請輸入學校 Google Email 進行驗證：</b></label>
                    <input type="email" id="voterEmail" required placeholder="example@tpshcm.edu.vn" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 6px;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label><b>您的表決意向：</b></label>
                    <div style="display: flex; gap: 20px; margin-top: 10px;">
                        <label style="cursor: pointer; font-size: 1.1rem;">
                            <input type="radio" name="choice" value="同意" required> 🟢 同意
                        </label>
                        <label style="cursor: pointer; font-size: 1.1rem;">
                            <input type="radio" name="choice" value="不同意"> 🔴 不同意
                        </label>
                    </div>
                </div>

                <button type="submit" class="ref-vote-btn" style="width: 100%; border: none; cursor: pointer;">確認送出選票</button>
            </form>
        </div>
    </main>

    <script>
        const GAS_REFERENDUM_API = "https://script.google.com/macros/s/AKfycbz3YUvaNzi4Ed3JfUSgdHtVQinjB30wMISJamSwK7OSn9wWFIyO_60na0myOdXBTLVe/exec";
        
        // 取得網址的 proposal_id
        const urlParams = new URLSearchParams(window.location.search);
        const proposalId = urlParams.get('id');

        async function loadProposalDetail() {
            const res = await fetch(`${GAS_REFERENDUM_API}?action=getProposals`);
            const proposals = await res.json();
            const current = proposals.find(p => p.id == proposalId);

            if (current) {
                document.getElementById("proposalTitle").innerText = current.title;
                document.getElementById("proposalDesc").innerText = current.description;
                document.getElementById("proposalEndTime").innerText = current.end_time;
            } else {
                alert("找不到此公投提案！");
                window.location.href = "referendum_index.html";
            }
        }

        document.getElementById("voteForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const email = document.getElementById("voterEmail").value;
            
            if (!email.endsWith("@tpshcm.edu.vn")) {
                alert("請使用學校官方 Email (@tpshcm.edu.vn) 進行投票！");
                return;
            }

            const choice = document.querySelector('input[name="choice"]:checked').value;

            const payload = {
                action: "submitVote",
                proposal_id: proposalId,
                voter_email: email,
                choice: choice
            };

            const res = await fetch(GAS_REFERENDUM_API, {
                method: "POST",
                body: JSON.stringify(payload)
            });

            const result = await res.json();
            if (result.success) {
                alert("投票成功！感謝您的參與。");
                window.location.href = "referendum_index.html";
            } else {
                alert(result.message || "投票失敗，您可能已經投過票了！");
            }
        });

        loadProposalDetail();
    </script>
</body>
</html>
